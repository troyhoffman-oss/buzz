[package]
name = "buzz-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local daemon that owns all Buzz protocol knowledge for terminal clients"

[lib]
name = "buzz_daemon"
path = "src/lib.rs"

[[bin]]
name = "buzz-daemon"
path = "src/main.rs"

[dependencies]
# Internal — reused VERBATIM per DESIGN.md §2.1. The daemon owns all protocol
# knowledge and gets it from these two crates rather than reimplementing it.
buzz-core = { workspace = true }
buzz-sdk = { workspace = true }
buzz-ws-client = { workspace = true }

# Explicit rustls with the `ring` provider, so the daemon can install a
# process-level `CryptoProvider` before its first `wss://` connect.
#
# Not optional and not cosmetic: `reqwest`'s rustls feature pulls `aws-lc-rs`
# through `hyper-rustls` while `buzz-acp`/`buzz-dev-mcp` pull `ring`, and a
# workspace build unifies both. With two providers enabled rustls refuses to
# auto-select one and **panics** at `ClientConfig::builder()` — which for this
# crate is the NIP-42 handshake, i.e. every connect. `buzz-cli`, `buzz-acp`,
# `buzz-admin`, `buzz-dev-mcp`, and `buzz-backend-kubernetes` each carry this
# same dependency for the same reason; the daemon was the one binary that
# opened a websocket without it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Nostr. `nip49` is the ncryptsec (NIP-49) identity format of DESIGN.md §2.5
# [D-8]; `nip44` is the observer-frame envelope of §2.5's guard chain; `nip98`
# is the HTTP-bridge auth the relay's REST surface expects.
nostr = { version = "0.44", features = ["std", "nip44", "nip49", "nip98"] }

# Async runtime
tokio = { workspace = true }

# HTTP server over a Unix domain socket. axum implements `Listener` for
# `tokio::net::UnixListener`, so no TCP listener ever ships (§2.5).
axum = { workspace = true }
tower = { workspace = true }

# HTTP client for the relay's NIP-98 bridge (`POST /query`, `/count`,
# `/events`). Mirrors `buzz-cli/src/client.rs`'s composition verbatim; see
# `crate::session::RestClient`.
reqwest = { workspace = true, features = ["json"] }
bytes = "1"

# `GET /event` is an ndjson/SSE body built from a broadcast receiver; axum wants
# a `Stream`, and `BroadcastStream` is the adapter (§4.1.1 deliverable 13).
futures-util = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

# SQLite cache at `~/.local/share/buzz/<hash>/cache.db`, `0600` (§4.1.1
# deliverable 3). `sqlx` is already the workspace's database crate and
# `sqlx-sqlite` is already in `Cargo.lock` via the workspace resolve, so this
# adds no new dependency cone — only a feature already being built.
sqlx = { workspace = true, features = ["sqlite"] }

# Byte-budgeted LRU for the decrypted-frame cache ([D-3]). The budget is in
# bytes, not frames, so the eviction order has to be explicit.
lru = "0.16"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# Paths / IDs / time
dirs = "6"
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }

# Socket-path hashing (§2.2 preimage)
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Key material and passphrases are held in zeroizing buffers (§2.5).
zeroize = { workspace = true }

# Errors + logging
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# uid for the peercred check of §2.5. Same crate/version as buzz-acp,
# buzz-agent, and buzz-dev-mcp; `user` is the feature carrying `getuid` and
# `fs` the `umask` that makes the socket 0600 at bind rather than after it.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user", "fs"] }

[dev-dependencies]
tempfile = "3"
